## Operator layout custom colour theme.
## Replace every 0xRRGGBB with a colour (for example 0x1a2b3c). The build stops if any
## placeholder is left. Dark backgrounds only. Add this file to the dongle's
## extra_conf_files in build.yaml; the theme keys then include "Custom". To start on it,
## also add CONFIG_PROSPECTOR_OPERATOR_THEME_CUSTOM=y.

CONFIG_PROSPECTOR_OPERATOR_CUSTOM_THEME=y

# Screen background, boxes behind the WPM number and layer name, and dark text on light
# fills. Must be dark; 0x000000 recommended (tinted backgrounds look washed out).
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_BG=0xRRGGBB

# Layer name, active layer dot and light number text.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_TEXT=0xRRGGBB

# TOP WPM and KEY PRESS labels, balance centre tick, modifier separators; base for
# inactive modifiers and layer dots.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_MUTED=0xRRGGBB

# Balance bar track.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_OUTLINE=0xRRGGBB

# WPM bars and the live WPM number.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_ACCENT=0xRRGGBB

# TOP WPM and KEY PRESS values, held modifiers.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_INFO=0xRRGGBB

# Balance bar marker.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_MARKER=0xRRGGBB

# CAPS WORD and CAPS LOCK when on.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_CAPS=0xRRGGBB

# Brightness level shown in the modifier row.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_BRIGHT=0xRRGGBB

# Battery ring and number box.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_BATTERY=0xRRGGBB

# Battery ring and number box when low.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_LOW=0xRRGGBB

# USB button: active fill, inactive outline.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_USB=0xRRGGBB

# BLE button: active fill, inactive outline.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_BLE=0xRRGGBB

# Active profile slot fill; inactive slots are a dim shade of it.
CONFIG_PROSPECTOR_OPERATOR_CUSTOM_SLOT=0xRRGGBB
