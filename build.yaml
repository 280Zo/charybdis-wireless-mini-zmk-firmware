# ── Prospector Dongle (Display Screen) Firmwares ──────────────────────────

  # Prospector builds support any Waveshare screen with the ST7789V2 display driver IC
  # including the touch (SKU 27057) and non-touch (SKU 24382) screens.

  # Prospector layout selection:
    # Operator is the default selection; swap in one of the files below to change the layout:
    #   - dongle_prospector_layouts/dongle_prospector_layout_classic.conf
    #   - dongle_prospector_layouts/dongle_prospector_layout_radii.conf
    #   - dongle_prospector_layouts/dongle_prospector_layout_field.conf
    #   - dongle_prospector_layouts/dongle_prospector_layout_operator.conf
    #
    # Radii-only color themes are selected with an extra overlay:
    #   - dongle_prospector_themes/dongle_prospector_theme_blue.overlay
    #   - dongle_prospector_themes/dongle_prospector_theme_green.overlay
    #   - dongle_prospector_themes/dongle_prospector_theme_red.overlay
    #   - dongle_prospector_themes/dongle_prospector_theme_purple.overlay
    #
    # Operator-only colour theme and background texture (one of each, optional; without
    # them the Operator screen keeps its original colours on a plain background). Remove
    # these lines when switching to another layout, or the build stops on a Kconfig warning:
    #   - dongle_prospector_operator_themes/dongle_prospector_operator_theme_ember.conf
    #   - dongle_prospector_operator_themes/dongle_prospector_operator_theme_glacier.conf
    #   - dongle_prospector_operator_themes/dongle_prospector_operator_theme_synthwave.conf
    #   - dongle_prospector_operator_themes/dongle_prospector_operator_theme_sea_shells.conf
    #   - dongle_prospector_operator_themes/dongle_prospector_operator_theme_github.conf
    #   - dongle_prospector_operator_textures/dongle_prospector_operator_texture_dots.conf
    #   - dongle_prospector_operator_textures/dongle_prospector_operator_texture_fine_grid.conf
    #   - dongle_prospector_operator_textures/dongle_prospector_operator_texture_hatch.conf
    #
    # Keyboard Knight is optional: remove the keyboard_knight and hidden_extra feature
    # lines below to build without the avatar page (the hidden extra needs the avatar page).
    # To keep the hidden extra without the Knight art, keep both lines and add a conf with
    # CONFIG_PROSPECTOR_AVATAR_SHOW_KEYBOARD_KNIGHT=n.


# ── Prospector Nice Nano v2 Dongle w/o APDS9960 ambient light sensor ──────────────────────────
  - name: dongle_prospector_nano_no_sensor
    board: nice_nano//zmk
    keymap:
      # - qwerty
      - colemak_dh
      # - canary
    builds:
      - shield: charybdis_left_dongle
      - shield: charybdis_right_dongle
      - shield: "charybdis_dongle prospector_adapter"
        extra_conf_files:
          - dongle_prospector/dongle_prospector_common.conf
          - dongle_prospector_layouts/dongle_prospector_layout_operator.conf
          - dongle_prospector_operator_themes/dongle_prospector_operator_theme_synthwave.conf
          - dongle_prospector_features/dongle_prospector_feature_diagnostics.conf
          - dongle_prospector_features/dongle_prospector_feature_keyboard_knight.conf
          - dongle_prospector_features/dongle_prospector_feature_hidden_extra.conf
          - dongle_prospector/dongle_prospector_no_sensor.conf
        extra_dtc_overlay_files:
          - dongle_prospector/dongle_prospector_no_sensor.overlay

